name: liquid-os
description: My personal OS image.
base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - atim/starship
    install:
      skip-unavailable: true
      packages:
        - zenity
        - starship
        
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.telegram.desktop
          - org.videolan.VLC
          - org.kde.krita
          - org.inkscape.Inkscape
          - org.darktable.Darktable
          - org.blender.Blender
          - org.onlyoffice.desktopeditors
          - com.transmissionbt.Transmission
          - org.jellyfin.JellyfinServer
          - org.kde.kdenlive
          - fr.handbrake.ghb
          - com.github.finefindus.eyedropper
          - org.mozilla.thunderbird_esr
          - dev.pulsar_edit.Pulsar
          - com.heroicgameslauncher.hgl
          - net.lutris.Lutris

  - type: signing
